<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F5HLIVE · Player Áudio (RTMP/FLV)</title>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--fg:#fff;--muted:#a1a1aa;--dim:#52525b;
  --accent:#f59e0b;--accent-h:#d97706;
  --danger:#ef4444;--danger-h:#dc2626;
  --success:#10b981;
}
html,body{height:100%;background:radial-gradient(ellipse at center,#1a1a1f 0%,#000 70%);color:var(--fg);font-family:'Inter',system-ui,-apple-system,sans-serif;overflow:hidden}
body{position:relative;display:flex;align-items:center;justify-content:center}

/* AUDIO STAGE */
.audio-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;z-index:1}
.orb-wrap{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.orb{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fbbf24,#d97706 50%,#78350f 100%);box-shadow:0 0 60px rgba(245,158,11,.4),inset 0 0 60px rgba(0,0,0,.3);transition:transform .1s ease-out;display:flex;align-items:center;justify-content:center;position:relative}
.orb::before{content:'';position:absolute;inset:-20px;border:2px solid rgba(245,158,11,.25);border-radius:50%;animation:ring 3s linear infinite}
.orb::after{content:'';position:absolute;inset:-40px;border:1px solid rgba(245,158,11,.15);border-radius:50%;animation:ring 3s linear infinite reverse}
@keyframes ring{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.05);opacity:.4}100%{transform:scale(1);opacity:.8}}
.orb.live{background:radial-gradient(circle at 30% 30%,#f87171,#dc2626 50%,#450a0a 100%);box-shadow:0 0 80px rgba(239,68,68,.5),inset 0 0 60px rgba(0,0,0,.3)}
.orb-icon{font-size:5rem;color:#fff;opacity:.95;z-index:2}
@media (prefers-reduced-motion:reduce){.orb::before,.orb::after{animation:none}}

.audio-meta{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.audio-meta h1{font-size:1.3rem;font-weight:700;letter-spacing:.3px}
.audio-meta p{font-size:.82rem;color:var(--muted);max-width:340px}
.audio-level-wrap{width:280px;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:8px}
.audio-level-bar{height:100%;width:0%;background:linear-gradient(to right,#22d3ee,#10b981,#f59e0b,#ef4444);border-radius:3px;transition:width .08s linear}

/* TOP BAR */
.top-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:16px;z-index:60;pointer-events:none}
.top-bar>*{pointer-events:auto}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--fg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge.live{background:var(--danger);border-color:var(--danger);opacity:0}
.badge.live.visible{opacity:1;animation:pulse 2s infinite}
.badge.audio-mode{background:rgba(245,158,11,.25);border-color:var(--accent);color:#fcd34d}
.badge.audio-mode::before{content:'';width:6px;height:6px;background:#fbbf24;border-radius:50%;box-shadow:0 0 6px #fbbf24}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.6);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.05rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .2s}
.icon-btn:hover{background:rgba(245,158,11,.25);color:var(--fg);border-color:var(--accent)}

/* CONTROLS */
.controls{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:22px;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 60%,transparent 100%);z-index:20;transition:opacity .3s}
.controls.hidden{opacity:0;pointer-events:none}
.ctrl-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.35rem;color:#fff;transition:all .2s;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ctrl-btn:hover:not(:disabled){background:rgba(255,255,255,.2);transform:scale(1.08)}
.ctrl-btn.primary{width:72px;height:72px;font-size:1.85rem;background:var(--accent);box-shadow:0 6px 24px rgba(245,158,11,.45)}
.ctrl-btn.primary:hover:not(:disabled){background:var(--accent-h)}
.ctrl-btn.primary.live{background:var(--danger);box-shadow:0 6px 24px rgba(239,68,68,.5)}
.ctrl-btn.danger{background:rgba(239,68,68,.85)}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-bg.visible{display:flex}
.modal{background:#0f0f12;border:1px solid #27272a;border-radius:14px;padding:24px;width:92%;max-width:440px}
.modal h2{font-size:1.05rem;margin-bottom:6px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal h2 i{color:var(--accent)}
.modal .modal-sub{font-size:.72rem;color:var(--dim);margin-bottom:18px;font-family:monospace;word-break:break-all}
.modal label{display:block;font-size:.68rem;font-weight:700;color:#71717a;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;margin-top:14px}
.modal input{width:100%;padding:10px 12px;background:#1a1a1e;border:1px solid #2a2a2e;border-radius:8px;color:#fff;font-size:.85rem;font-family:monospace}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{flex:1;padding:11px;border:none;border-radius:8px;font-size:.83rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.btn-cancel{background:#1f1f23;color:var(--muted)}
.btn-cancel:hover{background:#27272a;color:var(--fg)}
.btn-confirm{background:var(--accent);color:#fff}
.btn-confirm:hover{background:var(--accent-h)}

/* OVERLAY */
.center-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(0,0,0,.92);z-index:50;transition:opacity .3s}
.center-overlay.hidden{opacity:0;pointer-events:none}
.center-overlay .ico{font-size:4rem;color:var(--accent);opacity:.85}
.center-overlay h2{font-size:1.4rem;font-weight:700}
.center-overlay p{font-size:.82rem;color:var(--muted);text-align:center;max-width:360px;line-height:1.5}
.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-start{width:80px;height:80px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:2.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 8px 32px rgba(245,158,11,.4)}
.btn-start:hover{background:var(--accent-h);transform:scale(1.08)}
.btn-start:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* TOAST */
.toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);padding:10px 22px;background:rgba(245,158,11,.95);color:#fff;border-radius:8px;font-size:.82rem;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.visible{opacity:1}
.toast.err{background:rgba(239,68,68,.95)}
.toast.ok{background:rgba(16,185,129,.95)}

@media (max-width:640px){
  .controls{padding:14px;gap:8px}
  .ctrl-btn{width:46px;height:46px;font-size:1.15rem}
  .ctrl-btn.primary{width:62px;height:62px;font-size:1.55rem}
  .top-bar{padding:10px}
  .badge{font-size:.62rem;padding:5px 9px}
  .orb-wrap{width:180px;height:180px}
  .orb{width:150px;height:150px}
  .orb-icon{font-size:4rem}
  .audio-meta h1{font-size:1.05rem}
  .audio-meta p{font-size:.75rem}
  .audio-level-wrap{width:220px}
}
</style>
</head>
<body>

<!-- AUDIO ELEMENT (hidden) -->
<audio id="audioElement" playsinline></audio>

<!-- AUDIO STAGE -->
<div class="audio-stage">
  <div class="orb-wrap">
    <div class="orb" id="orb">
      <i class="ti ti-headphones orb-icon"></i>
    </div>
  </div>
  <div class="audio-meta">
    <h1 id="audioTitle">Áudio ao Vivo</h1>
    <p id="audioSub">Aguardando conexão</p>
    <div class="audio-level-wrap"><div class="audio-level-bar" id="levelBar"></div></div>
  </div>
</div>

<!-- OFFLINE OVERLAY -->
<div class="center-overlay" id="offlineOverlay">
  <i class="ti ti-headphones ico"></i>
  <h2>Pronto para ouvir</h2>
  <p id="offlineMsg">Conta <strong>g9FP3A</strong> · Stream <strong>teste1</strong></p>
  <div style="display:flex;gap:14px;align-items:center">
    <button class="btn-start" id="btnPlayOffline" title="Ouvir"><i class="ti ti-player-play-filled"></i></button>
    <button class="icon-btn" id="btnConfigOffline" style="width:80px;height:80px;font-size:2rem" title="Configurar"><i class="ti ti-adjustments"></i></button>
  </div>
</div>

<!-- STATUS OVERLAY -->
<div class="center-overlay hidden" id="statusOverlay">
  <div class="spinner"></div>
  <h2 id="statusTitle">Conectando...</h2>
  <p id="statusSub">Conectando ao servidor de stream...</p>
</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="badges">
    <div class="badge live" id="liveBadge"><i class="ti ti-player-record-filled"></i> LIVE</div>
    <div class="badge audio-mode">AUDIO</div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btnSettings" title="Configurações"><i class="ti ti-adjustments"></i></button>
    <button class="icon-btn" id="btnFs" title="Tela cheia"><i class="ti ti-maximize"></i></button>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls hidden" id="controls">
  <button class="ctrl-btn" id="btnMute" title="Mudo"><i class="ti ti-volume-2"></i></button>
  <button class="ctrl-btn primary" id="btnPlay" title="Ouvir"><i class="ti ti-player-play-filled"></i></button>
  <button class="ctrl-btn danger" id="btnStop" title="Parar" disabled><i class="ti ti-player-stop-filled"></i></button>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModalBg">
  <div class="modal">
    <h2><i class="ti ti-adjustments"></i> Configurar Áudio</h2>
    <div class="modal-sub" id="urlHint">wss://director-ca.f5hlive.com.br/live/g9FP3A/teste1.flv</div>
    <label>Host</label>
    <input type="text" id="mHost" value="director-ca.f5hlive.com.br">
    <label>Account ID</label>
    <input type="text" id="mAccount" value="g9FP3A">
    <label>Stream Name</label>
    <input type="text" id="mStream" value="teste1">
    <div class="modal-actions">
      <button class="btn-cancel" id="settingsCancel"><i class="ti ti-x"></i> Cancelar</button>
      <button class="btn-confirm" id="settingsSave"><i class="ti ti-check"></i> Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let player = null;
let isMuted = false;
let audioContext = null;
let analyser = null;
let levelRafId = null;

let config = { host: 'director-ca.f5hlive.com.br', account: 'g9FP3A', stream: 'teste1' };

function getUrl() {
    return `wss://${config.host}/live/${config.account}/${config.stream}.flv`;
}

function updateUrlHint() {
    $('urlHint').textContent = getUrl();
}

let toastTimer = null;
function showToast(msg, type = '') {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast visible' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('visible'), 2800);
}

// AUDIO VISUALIZER
function startAudioVisualizer(stream) {
    try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const timeData = new Uint8Array(analyser.frequencyBinCount);

        function draw() {
            if (!analyser) return;
            levelRafId = requestAnimationFrame(draw);
            analyser.getByteTimeDomainData(timeData);
            let sum = 0;
            for (let i = 0; i < timeData.length; i++) {
                const norm = (timeData[i] - 128) / 128;
                sum += norm * norm;
            }
            const rms = Math.sqrt(sum / timeData.length);
            const level = Math.min(100, rms * 200);
            $('levelBar').style.width = level + '%';
            const scale = 1 + (level / 100) * 0.12;
            $('orb').style.transform = `scale(${scale})`;
        }
        draw();
    } catch (e) {
        console.log('Visualizer falhou:', e.message);
    }
}

function stopAudioVisualizer() {
    if (levelRafId) { cancelAnimationFrame(levelRafId); levelRafId = null; }
    if (audioContext) { try { audioContext.close(); } catch(e){} audioContext = null; }
    analyser = null;
    $('levelBar').style.width = '0%';
    $('orb').style.transform = 'scale(1)';
}

function play() {
    const url = getUrl();
    $('offlineOverlay').classList.add('hidden');
    $('statusOverlay').classList.remove('hidden');
    $('statusTitle').textContent = 'Conectando...';
    $('statusSub').textContent = url;

    try {
        if (typeof mpegts === 'undefined') throw new Error('mpegts.js não carregou');
        player = mpegts.createPlayer({ type: 'flv', url, isLive: true, cors: true }, {
            enableWorker: false, lazyLoad: false, autoCleanupSourceBuffer: true,
            stashInitialSize: 256, liveBufferLatencyChasing: false
        });
    } catch (e) {
        showToast(e.message, 'err');
        $('statusOverlay').classList.add('hidden');
        $('offlineOverlay').classList.remove('hidden');
        $('btnPlayOffline').disabled = false;
        return;
    }

    player.on(mpegts.Events.ERROR, function(errType, errDetail) {
        showToast('Erro: ' + errType, 'err');
        stop();
    });
    player.on(mpegts.Events.LOADING_COMPLETE, function() {
        showToast('Stream finalizado', 'ok');
        stop();
    });

    try {
        player.attachMediaElement($('audioElement'));
        player.load();
        player.play().then(() => {
            $('statusOverlay').classList.add('hidden');
            $('controls').classList.remove('hidden');
            $('liveBadge').classList.add('visible');
            $('orb').classList.add('live');
            $('btnPlay').disabled = true;
            $('btnStop').disabled = false;
            $('audioTitle').textContent = 'Áudio Ao Vivo';
            $('audioSub').textContent = 'Recebendo stream de áudio...';

            // Iniciar visualizador de áudio
            if ($('audioElement').captureStream) {
                startAudioVisualizer($('audioElement').captureStream());
            } else if ($('audioElement').mozCaptureStream) {
                startAudioVisualizer($('audioElement').mozCaptureStream());
            }
            showToast('Conectado', 'ok');
        }).catch(e => {
            showToast('Auto-play bloqueado. Clique no play.', 'err');
            $('statusOverlay').classList.add('hidden');
            $('controls').classList.remove('hidden');
        });
    } catch (e) {
        showToast(e.message, 'err');
        $('statusOverlay').classList.add('hidden');
        $('offlineOverlay').classList.remove('hidden');
        $('btnPlayOffline').disabled = false;
    }
}

function stop() {
    if (player) { try { player.destroy(); } catch(e){} player = null; }
    $('audioElement').src = '';
    stopAudioVisualizer();
    $('offlineOverlay').classList.remove('hidden');
    $('liveBadge').classList.remove('visible');
    $('orb').classList.remove('live');
    $('controls').classList.add('hidden');
    $('btnPlay').disabled = false;
    $('btnStop').disabled = true;
    $('audioTitle').textContent = 'Áudio ao Vivo';
    $('audioSub').textContent = 'Aguardando conexão';
    $('btnPlayOffline').disabled = false;
}

// Events
$('btnPlay').addEventListener('click', play);
$('btnPlayOffline').addEventListener('click', play);
$('btnStop').addEventListener('click', stop);
$('btnConfigOffline').addEventListener('click', () => $('settingsModalBg').classList.add('visible'));
$('btnSettings').addEventListener('click', () => $('settingsModalBg').classList.add('visible'));
$('settingsCancel').addEventListener('click', () => $('settingsModalBg').classList.remove('visible'));
$('settingsSave').addEventListener('click', () => {
    config.host = $('mHost').value.trim() || config.host;
    config.account = $('mAccount').value.trim() || config.account;
    config.stream = $('mStream').value.trim() || config.stream;
    $('settingsModalBg').classList.remove('visible');
    if (player) stop();
    updateUrlHint();
    $('offlineMsg').innerHTML = `Conta <strong>${config.account}</strong> · Stream <strong>${config.stream}</strong>`;
    showToast('Configuração salva', 'ok');
});
$('settingsModalBg').addEventListener('click', e => { if (e.target === $('settingsModalBg')) $('settingsModalBg').classList.remove('visible'); });

$('btnMute').addEventListener('click', () => {
    const v = $('audioElement');
    v.muted = !v.muted;
    isMuted = v.muted;
    $('btnMute').innerHTML = isMuted ? '<i class="ti ti-volume-3"></i>' : '<i class="ti ti-volume-2"></i>';
});

$('btnFs').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
});

// Init
updateUrlHint();
</script>
</body>
</html>
